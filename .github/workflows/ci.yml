name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - name: Testes (seleção, cruzamento, mutação, determinismo)
        run: npm test
      - name: Experimentos em modo rápido (fumaça)
        run: node experimentos/rodar.js --rapido --threads 2
